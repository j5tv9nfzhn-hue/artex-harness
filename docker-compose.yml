services:
  postgres-harness:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex_harness}
    volumes:
      - pgdata-harness:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex_harness} -d ${POSTGRES_DB:-artex_harness}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex-harness:
    image: artex-harness:${ARTEX_TAG:-latest}
    depends_on:
      postgres-harness:
        condition: service_healthy
    environment:
      HARNESS_PG_DSN: postgres://${POSTGRES_USER:-artex_harness}:${POSTGRES_PASSWORD}@postgres-harness:5432/${POSTGRES_DB:-artex_harness}?sslmode=disable
      ARTEX_UPDATE_GITHUB_TOKEN: ${ARTEX_UPDATE_GITHUB_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8797:8797"
      - "127.0.0.1:8798:8798"
    volumes:
      # 把数据目录（含 SQLite 等）绑定到项目根目录的 data-harness/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data-harness:/app/data-harness
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata-harness:
